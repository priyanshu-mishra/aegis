[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Conformal risk engine: SLM semantic parser, quantitative factor engine, conformal (NCM) calibration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "arch>=6.3",
    "lightgbm>=4.3",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]
llm = ["transformers>=4.44", "torch>=2.3", "outlines>=0.1", "huggingface_hub>=0.24"]
dashboard = ["streamlit>=1.36"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not llm'"
markers = [
    "network: needs internet access (yfinance, FOMC download)",
    "llm: needs a local SLM backend (Ollama or transformers)",
    "slow: long-running statistical tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Greek letters (α, σ, μ) in math docstrings
