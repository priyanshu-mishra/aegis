<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Aegis architecture</title>
  <desc id="d">Data sources feed a semantic parser and a factor engine; their forecasts go through a conformal layer and a walk-forward evaluation that writes reports and a dashboard.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .hero { fill: #eef4fc; stroke: #2a78d6; }
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
    .accent { fill: #2a78d6; }
    .arrow { stroke: #898781; fill: none; }
    .head { fill: #898781; }
    .tag { fill: #f0efec; } .tagtext { fill: #52514e; }
    .loop { stroke: #2a78d6; fill: none; } .loophead { fill: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .hero { fill: #132034; stroke: #3987e5; }
      .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .accent { fill: #3987e5; }
      .tag { fill: #21262d; } .tagtext { fill: #c3c2b7; }
      .loop { stroke: #3987e5; } .loophead { fill: #3987e5; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="loophead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Column 1: data -->
  <g transform="translate(20,40)">
    <text class="muted" x="0" y="0" font-size="12" font-weight="600" letter-spacing="1">1 · DATA</text>
    <rect class="box" x="0" y="16" width="210" height="112" rx="12"/>
    <text class="ink" x="16" y="44" font-size="15" font-weight="600">Prices</text>
    <text class="ink2" x="16" y="66" font-size="12.5">SPY · TLT · GLD · USO · VIX</text>
    <text class="ink2" x="16" y="86" font-size="12.5">yfinance, parquet cache</text>
    <text class="ink2" x="16" y="106" font-size="12.5">2010 → today</text>

    <rect class="box" x="0" y="148" width="210" height="112" rx="12"/>
    <text class="ink" x="16" y="176" font-size="15" font-weight="600">Text</text>
    <text class="ink2" x="16" y="198" font-size="12.5">139 FOMC statements</text>
    <text class="ink2" x="16" y="218" font-size="12.5">release times parsed</text>
    <text class="ink2" x="16" y="238" font-size="12.5">as-of: before 4 p.m. ET close</text>

    <rect class="box" x="0" y="280" width="210" height="112" rx="12"/>
    <text class="ink" x="16" y="308" font-size="15" font-weight="600">Synthetic world</text>
    <text class="ink2" x="16" y="330" font-size="12.5">latent shocks drive returns,</text>
    <text class="ink2" x="16" y="350" font-size="12.5">regimes and headlines;</text>
    <text class="ink2" x="16" y="370" font-size="12.5">signal strength = SNR</text>
  </g>

  <!-- Column 2: parser -->
  <g transform="translate(270,40)">
    <text class="muted" x="0" y="0" font-size="12" font-weight="600" letter-spacing="1">2 · SEMANTIC PARSER</text>
    <rect class="box" x="0" y="16" width="210" height="376" rx="12"/>
    <text class="ink" x="16" y="44" font-size="15" font-weight="600">Text → RiskSignal</text>
    <text class="ink2" x="16" y="72" font-size="12.5">mask dates, events, names</text>
    <rect class="tag" x="16" y="88" width="178" height="26" rx="6"/>
    <text class="tagtext" x="28" y="106" font-size="12">Lexicon · 0.09 ms</text>
    <rect class="tag" x="16" y="120" width="178" height="26" rx="6"/>
    <text class="tagtext" x="28" y="138" font-size="12">Ollama SLM · 1.8 s</text>
    <text class="ink2" x="16" y="172" font-size="12.5">JSON-schema decoding,</text>
    <text class="ink2" x="16" y="192" font-size="12.5">pydantic validation,</text>
    <text class="ink2" x="16" y="212" font-size="12.5">retry → lexicon fallback</text>
    <text class="ink2" x="16" y="232" font-size="12.5">SQLite cache</text>
    <text class="ink" x="16" y="266" font-size="13" font-weight="600">Output</text>
    <text class="ink2" x="16" y="288" font-size="12.5">rate_pressure · credit_stress</text>
    <text class="ink2" x="16" y="308" font-size="12.5">geopolitical_tension · …</text>
    <text class="ink" x="16" y="340" font-size="13" font-weight="600">Daily features</text>
    <text class="ink2" x="16" y="362" font-size="12.5">decayed levels, clipped</text>
    <text class="ink2" x="16" y="380" font-size="12.5">to the training range</text>
  </g>

  <!-- Column 3: factor engine -->
  <g transform="translate(520,40)">
    <text class="muted" x="0" y="0" font-size="12" font-weight="600" letter-spacing="1">3 · FACTOR ENGINE</text>
    <rect class="box" x="0" y="16" width="210" height="376" rx="12"/>
    <text class="ink" x="16" y="44" font-size="15" font-weight="600">Risk model</text>
    <text class="ink2" x="16" y="72" font-size="12.5">EWMA covariance (λ 0.94)</text>
    <text class="ink2" x="16" y="92" font-size="12.5">× semantic shock overlay</text>
    <text class="ink2" x="16" y="112" font-size="12.5">Σ̃ = D Σ D (stays PSD)</text>
    <text class="ink" x="16" y="146" font-size="13" font-weight="600">Features X_t</text>
    <text class="ink2" x="16" y="168" font-size="12.5">HAR vol 1/5/22 days,</text>
    <text class="ink2" x="16" y="188" font-size="12.5">EWMA vol, VIX, text</text>
    <text class="ink" x="16" y="222" font-size="13" font-weight="600">Models (ridge, CV)</text>
    <text class="ink2" x="16" y="244" font-size="12.5">point μ̂(X)</text>
    <text class="ink2" x="16" y="264" font-size="12.5">scale σ̂(X)</text>
    <text class="ink2" x="16" y="284" font-size="12.5">quantiles q̂_lo, q̂_hi</text>
    <text class="ink" x="16" y="318" font-size="13" font-weight="600">Targets</text>
    <text class="ink2" x="16" y="340" font-size="12.5">A · 5-day log realized vol</text>
    <text class="ink2" x="16" y="360" font-size="12.5">B · next-day return (VaR)</text>
  </g>

  <!-- Column 4: conformal -->
  <g transform="translate(770,40)">
    <text class="accent" x="0" y="0" font-size="12" font-weight="700" letter-spacing="1">4 · CONFORMAL LAYER</text>
    <rect class="hero" x="0" y="16" width="190" height="376" rx="12" stroke-width="1.5"/>
    <text class="ink" x="16" y="44" font-size="15" font-weight="600">Calibrated sets</text>
    <text class="ink2" x="16" y="72" font-size="12.5">score S = |y − μ̂|</text>
    <text class="ink2" x="16" y="92" font-size="12.5">q̂ = ⌈(n+1)(1−α)⌉-th S</text>
    <text class="ink2" x="16" y="112" font-size="12.5">C(X) = μ̂ ± q̂</text>
    <rect class="tag" x="16" y="132" width="158" height="26" rx="6"/>
    <text class="tagtext" x="28" y="150" font-size="12">split · normalized</text>
    <rect class="tag" x="16" y="164" width="158" height="26" rx="6"/>
    <text class="tagtext" x="28" y="182" font-size="12">CQR · rolling</text>
    <rect class="tag" x="16" y="196" width="158" height="26" rx="6"/>
    <text class="tagtext" x="28" y="214" font-size="12" font-weight="600">ACI (adaptive)</text>
    <rect class="tag" x="16" y="228" width="158" height="26" rx="6"/>
    <text class="tagtext" x="28" y="246" font-size="12">one-sided VaR</text>
    <text class="ink" x="16" y="284" font-size="13" font-weight="600">ACI update</text>
    <text class="ink2" x="16" y="306" font-size="12.5">α_t ← α_t + γ(α − miss_t)</text>
    <text class="ink2" x="16" y="330" font-size="12.5">long-run coverage for</text>
    <text class="ink2" x="16" y="350" font-size="12.5">any sequence, no</text>
    <text class="ink2" x="16" y="370" font-size="12.5">exchangeability needed</text>
  </g>

  <!-- Column 5: evaluation -->
  <g transform="translate(1000,40)">
    <text class="muted" x="0" y="0" font-size="12" font-weight="600" letter-spacing="1">5 · EVALUATE</text>
    <rect class="box" x="0" y="16" width="180" height="180" rx="12"/>
    <text class="ink" x="16" y="44" font-size="15" font-weight="600">Walk-forward</text>
    <text class="ink2" x="16" y="70" font-size="12.5">coverage, Winkler,</text>
    <text class="ink2" x="16" y="90" font-size="12.5">by year and vol regime</text>
    <text class="ink2" x="16" y="116" font-size="12.5">Kupiec · Christoffersen</text>
    <text class="ink2" x="16" y="136" font-size="12.5">vs Gaussian, historical</text>
    <text class="ink2" x="16" y="156" font-size="12.5">simulation, GARCH</text>
    <text class="ink2" x="16" y="182" font-size="12.5">text ablation, latency</text>

    <rect class="box" x="0" y="216" width="180" height="176" rx="12"/>
    <text class="ink" x="16" y="244" font-size="15" font-weight="600">Outputs</text>
    <text class="ink2" x="16" y="270" font-size="12.5">markdown report</text>
    <text class="ink2" x="16" y="290" font-size="12.5">metrics.json, figures</text>
    <text class="ink2" x="16" y="310" font-size="12.5">Streamlit dashboard</text>
    <text class="ink2" x="16" y="336" font-size="12.5">one CLI:</text>
    <text class="ink" x="16" y="358" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">python main.py demo</text>
  </g>

  <!-- arrows -->
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M230 244 L268 244"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M230 90 C 248 90 248 22 266 22 L 486 22 C 504 22 502 90 518 90"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M230 376 C 248 376 250 290 268 290"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M480 244 L518 244"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M730 244 L768 244"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M960 140 L998 140"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M1090 236 L1090 254"/>

  <!-- feedback loop: realized outcomes update the online methods -->
  <path class="loop" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahb)"
        d="M1090 432 C 1090 500 1000 506 865 506 C 865 506 865 470 865 434"/>
  <text class="accent" x="560" y="530" font-size="12.5">outcomes revealed h days later → online recalibration (ACI, rolling)</text>
</svg>
