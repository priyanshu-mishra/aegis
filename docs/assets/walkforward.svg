<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Walk-forward protocol</title>
  <desc id="d">Train 2010 to 2017, calibrate 2018 to 2019, test 2020 to 2026 one day at a time, with 5-day embargoes between segments. On each test day, news before the close feeds features, an interval is issued for the next five days, and the outcome is revealed five days later.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
    .train { fill: #c3c2b7; } .cal { fill: #86b6ef; } .test { fill: #2a78d6; }
    .emb { fill: #e34948; } .axis { stroke: #c3c2b7; }
    .box { fill: #ffffff; stroke: #d0d7de; } .accent { fill: #2a78d6; } .accent-s { stroke: #2a78d6; }
    .arrow { stroke: #898781; fill: none; } .head { fill: #898781; } .wt { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .train { fill: #52514e; } .cal { fill: #1c5cab; } .test { fill: #3987e5; }
      .emb { fill: #e66767; } .axis { stroke: #383835; }
      .box { fill: #161b22; stroke: #30363d; } .accent { fill: #3987e5; } .accent-s { stroke: #3987e5; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Timeline: widths proportional to trading days (1986 + 498 + 1712) -->
  <text class="muted" x="40" y="34" font-size="12" font-weight="600" letter-spacing="1">DATA SPLITS (TRADING DAYS)</text>
  <rect class="train" x="40" y="50" width="526" height="44" rx="8"/>
  <rect class="emb" x="568" y="50" width="4" height="44"/>
  <rect class="cal" x="574" y="50" width="132" height="44" rx="8"/>
  <rect class="emb" x="708" y="50" width="4" height="44"/>
  <rect class="test" x="714" y="50" width="446" height="44" rx="8"/>
  <text class="ink" x="56" y="77" font-size="14" font-weight="600">Train · 2010 – 2017 · 1,986 days</text>
  <text class="ink" x="586" y="77" font-size="13" font-weight="600">Calibrate</text>
  <text class="wt" x="730" y="77" font-size="14" font-weight="600">Test, walk-forward · 2020 – 2026 · 1,712 days</text>
  <text class="ink2" x="586" y="114" font-size="12">2018 – 2019 · 498</text>
  <text class="ink2" x="56" y="114" font-size="12">fit point, scale, quantile models and the shock overlay</text>
  <text class="ink2" x="730" y="114" font-size="12">score one day at a time; online methods update as outcomes arrive</text>
  <path class="emb" d="M570 128 L570 138"/>
  <text class="ink2" x="430" y="148" font-size="12"><tspan class="emb" font-weight="600">■</tspan> 5-day embargo: drops rows whose 5-day target would reach into the next segment</text>

  <!-- One test day -->
  <text class="muted" x="40" y="196" font-size="12" font-weight="600" letter-spacing="1">ONE TEST DAY t (NOTHING FROM AFTER t IS USED)</text>
  <line class="axis" x1="40" y1="300" x2="1160" y2="300" stroke-width="1.5"/>

  <g transform="translate(40,214)">
    <rect class="box" width="230" height="70" rx="10"/>
    <text class="ink" x="14" y="26" font-size="14" font-weight="600">News before 4 p.m. ET</text>
    <text class="ink2" x="14" y="48" font-size="12">masked → parsed → bucketed</text>
    <text class="ink2" x="14" y="64" font-size="12">into day t (after close → t+1)</text>
  </g>
  <g transform="translate(310,214)">
    <rect class="box" width="210" height="70" rx="10"/>
    <text class="ink" x="14" y="26" font-size="14" font-weight="600">Features X_t</text>
    <text class="ink2" x="14" y="48" font-size="12">prices and VIX through t,</text>
    <text class="ink2" x="14" y="64" font-size="12">text clipped to train range</text>
  </g>
  <g transform="translate(560,214)">
    <rect class="box" width="250" height="70" rx="10" stroke-width="1.5" style="stroke:#2a78d6"/>
    <text class="accent" x="14" y="26" font-size="14" font-weight="700">Issue interval C(X_t)</text>
    <text class="ink2" x="14" y="48" font-size="12">for vol over t+1 … t+5,</text>
    <text class="ink2" x="14" y="64" font-size="12">and VaR for t+1</text>
  </g>
  <g transform="translate(850,214)">
    <rect class="box" width="310" height="70" rx="10"/>
    <text class="ink" x="14" y="26" font-size="14" font-weight="600">Outcome revealed at t+5</text>
    <text class="ink2" x="14" y="48" font-size="12">covered? → ACI: α ← α + γ(α − miss)</text>
    <text class="ink2" x="14" y="64" font-size="12">rolling: add score, drop the oldest</text>
  </g>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M270 249 L308 249"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M520 249 L558 249"/>
  <path class="arrow" stroke-width="1.6" marker-end="url(#ah)" d="M810 249 L848 249"/>

  <g font-size="12">
    <circle class="ink2" cx="155" cy="300" r="4"/><text class="ink2" x="155" y="322" text-anchor="middle">close of day t</text>
    <circle class="accent" cx="685" cy="300" r="4"/><text class="ink2" x="685" y="322" text-anchor="middle">forecast horizon t+1 … t+5</text>
    <circle class="ink2" cx="1005" cy="300" r="4"/><text class="ink2" x="1005" y="322" text-anchor="middle">t+5: feedback used from t+5 on</text>
  </g>

  <text class="ink2" x="40" y="372" font-size="12.5">Leakage test: perturb every price after a test day t and re-run; every interval and VaR level dated ≤ t must be identical.</text>
  <text class="ink2" x="40" y="394" font-size="12.5">It passes for prices, news timing, inverse-vol weights, the overlay, GARCH and all conformal methods.</text>
</svg>
